<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15122b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<title>Vida RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap">
<style>

:root{
  --bg:#15122b;
  --panel:#221c45;
  --panel-2:#2c2559;
  --line:#463c8a;
  --ink:#f3ecd2;
  --dim:#a9a2d6;
  --gold:#ffcf4a;
  --green:#62d26f;
  --red:#ff5d6c;
  --blue:#5aa9ff;
  --teal:#2fd0b5;
  --orange:#ff9a3d;
  --shadow:#0b0919;
  --font-display:'Press Start 2P',ui-monospace,Menlo,monospace;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 48px;
  background-image:
    linear-gradient(var(--bg),var(--bg));
}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;line-height:1.5;text-wrap:balance}
h1{font-size:15px;letter-spacing:.02em}
h2{font-size:12px;color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
h3{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .tag{font-family:var(--font-display);font-size:9px;color:var(--dim)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.tab{flex:0 0 auto;background:var(--panel);border:3px solid var(--line);padding:9px 12px;font-family:var(--font-display);font-size:9px;letter-spacing:.04em;cursor:pointer;color:var(--dim);box-shadow:0 4px 0 var(--shadow)}
.tab[aria-selected="true"]{background:var(--gold);color:#241a00;border-color:#fff2b0}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr))}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:0 5px 0 var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{background:var(--panel-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.dim{color:var(--dim)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.btn{background:var(--panel-2);border:3px solid var(--line);padding:7px 12px;cursor:pointer;box-shadow:0 3px 0 var(--shadow);font-family:var(--font-display);font-size:9px;letter-spacing:.03em}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.gold{background:var(--gold);color:#241a00;border-color:#fff2b0}
.btn.green{background:var(--green);color:#06260c;border-color:#c9ffd0}
.btn.red{background:var(--red);color:#2e0006;border-color:#ffc1c8}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 8px;font-size:8px}
input,select{background:#120f26;border:3px solid var(--line);padding:7px 9px;min-width:0;max-width:100%}
input[type=number]{width:120px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim);min-width:0}
.bar{position:relative;height:16px;background:#120f26;border:3px solid var(--line);overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .5s steps(12)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(11,9,25,.55) 6px 8px);pointer-events:none}
.bar.tall{height:22px}
.bar.thin{height:12px;border-width:2px}
.lbl{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:15px}
.lbl b{font-weight:600}
.pill{display:inline-block;font-family:var(--font-display);font-size:8px;padding:4px 6px;border:2px solid currentColor;letter-spacing:.04em;white-space:nowrap}
.pill.est{color:var(--orange)}
.pill.ok{color:var(--green)}
.pill.warn{color:var(--gold)}
.pill.bad{color:var(--red)}
.pill.info{color:var(--blue)}
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:520px){.hero-grid{grid-template-columns:1fr;justify-items:center;text-align:center}.hero-grid .col{width:100%;text-align:left}}
.sprite{width:176px;height:176px;background:#120f26;border:3px solid var(--line);display:grid;place-items:center;image-rendering:pixelated;flex:0 0 auto}
.sprite svg{width:150px;height:150px;shape-rendering:crispEdges;animation:bob 1.1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.xpnum{font-family:var(--font-display);font-size:11px;line-height:1.6}
.chart{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:3px solid var(--line);padding-top:6px}
.chart>div{flex:1 1 0;min-width:2px;background:var(--teal);position:relative}
.chart>div.cur{background:var(--gold)}
.chart>div.y25{background:var(--blue)}
.chart>div.y24{background:#8d82e0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px}
.step{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:2px dashed var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.step:first-of-type{border-top:0}
.box{width:18px;height:18px;border:3px solid var(--line);background:#120f26;flex:0 0 auto;display:grid;place-items:center}
.box.on{background:var(--green);border-color:#c9ffd0}
.box.on::after{content:"";width:6px;height:6px;background:#06260c}
.step.done span{text-decoration:line-through;color:var(--dim)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.tile{background:var(--panel-2);border:3px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;font-size:14px;position:relative;box-shadow:0 3px 0 var(--shadow);min-width:0}
.tile span{overflow-wrap:anywhere}
.tile svg{width:40px;height:40px;shape-rendering:crispEdges}
.tile.fora{border-color:var(--red)}
.tile.olho{border-color:var(--gold)}
.tile.safe{border-color:var(--green)}
.tile.cart{background:#17402a}
.tile .x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;background:var(--red);border:2px solid #ffc1c8;color:#2e0006;display:grid;place-items:center;font-size:12px;line-height:1}
.zone{border:3px solid;padding:12px;display:flex;flex-direction:column;gap:10px}
.zone.fora{border-color:var(--red)}
.zone.olho{border-color:var(--gold)}
.zone.safe{border-color:var(--green)}
.zone h3{display:flex;justify-content:space-between;gap:8px}
.score{font-family:var(--font-display);font-size:30px;line-height:1.2}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t td,table.t th{padding:6px 8px;border-top:2px dashed var(--line);text-align:left;vertical-align:middle}
table.t th{font-family:var(--font-display);font-size:8px;color:var(--dim);font-weight:400;border-top:0}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}
.empty{border:3px dashed var(--line);padding:22px;text-align:center;color:var(--dim)}
details>summary{cursor:pointer;font-family:var(--font-display);font-size:9px;color:var(--gold);padding:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--gold);color:#241a00;border:3px solid #fff2b0;padding:9px 14px;font-family:var(--font-display);font-size:9px;z-index:20;box-shadow:0 4px 0 var(--shadow);max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
.timer{font-family:var(--font-display);font-size:22px;color:var(--green)}
.tipbox{border-left:6px solid var(--blue);background:#1a1740;padding:10px 12px;font-size:15px}
a{color:var(--blue)}
@media (prefers-reduced-motion:reduce){.sprite svg{animation:none}.bar>i{transition:none}}

:root{--mag:#ff2e88;--cy:#19e3ff;--bg:#0e0a22;--panel:#1b1540;--panel-2:#261d58;--line:#5a4cc4;--blk:#05030f}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 50% 50%,rgba(255,46,136,.22) 1.3px,transparent 1.9px),
    radial-gradient(circle at 50% 50%,rgba(25,227,255,.16) 1.3px,transparent 1.9px);
  background-size:16px 16px,16px 16px;
  background-position:0 0,8px 8px;
  background-attachment:fixed;
}
h1{font-size:clamp(16px,4.6vw,24px);text-shadow:3px 0 var(--mag),-3px 0 var(--cy),0 4px 0 var(--blk);animation:misreg 2.4s steps(1) infinite;transform:skewX(-6deg);display:inline-block}
@keyframes misreg{0%{text-shadow:3px 0 var(--mag),-3px 0 var(--cy),0 4px 0 var(--blk)}46%{text-shadow:3px 0 var(--mag),-3px 0 var(--cy),0 4px 0 var(--blk)}48%{text-shadow:-5px 1px var(--mag),5px -1px var(--cy),0 4px 0 var(--blk)}50%{text-shadow:6px -1px var(--mag),-4px 2px var(--cy),0 4px 0 var(--blk)}52%{text-shadow:3px 0 var(--mag),-3px 0 var(--cy),0 4px 0 var(--blk)}}
.top .tag{background:var(--gold);color:var(--blk);padding:6px 9px;border:3px solid var(--blk);box-shadow:4px 4px 0 var(--mag);transform:rotate(2deg)}
.tabs{padding:6px 6px 14px}
.tab{border:3px solid var(--blk);background:var(--panel-2);color:var(--ink);transform:skewX(-8deg);box-shadow:4px 4px 0 var(--blk);transition:transform .12s steps(2)}
.tab:hover{transform:skewX(-8deg) translateY(-3px)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--blk);box-shadow:4px 4px 0 var(--mag),8px 8px 0 var(--blk);transform:skewX(-8deg) translateY(-3px)}
.card{border:3px solid var(--blk);background:var(--panel);box-shadow:6px 6px 0 var(--mag);position:relative;outline:2px solid rgba(243,236,210,.2);outline-offset:-7px}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 1px,transparent 1.5px) 0 0/7px 7px;mask-image:linear-gradient(135deg,#000 0,transparent 45%);-webkit-mask-image:linear-gradient(135deg,#000 0,transparent 45%)}
.grid>.cw:nth-child(even)>.card,.grid>.card:nth-child(even),.grid>.col>.card:nth-child(even){box-shadow:6px 6px 0 var(--cy)}
.card.hero{box-shadow:8px 8px 0 var(--cy),14px 14px 0 var(--mag);background:linear-gradient(135deg,#2c2270 0,#1b1540 60%)}
h2{text-shadow:2px 2px 0 var(--blk);font-size:clamp(11px,3vw,14px)}
h2::before{content:"";display:inline-block;width:12px;height:12px;background:var(--mag);margin-right:8px;transform:rotate(45deg);box-shadow:2px 2px 0 var(--blk)}
.btn{border:3px solid var(--blk);box-shadow:4px 4px 0 var(--blk);transform:skewX(-6deg);transition:transform .1s steps(2)}
.btn:hover{transform:skewX(-6deg) translateY(-2px)}
.btn:active{transform:skewX(-6deg) translate(3px,3px);box-shadow:1px 1px 0 var(--blk)}
.btn.gold{box-shadow:4px 4px 0 var(--mag)}
.btn.green{box-shadow:4px 4px 0 var(--cy)}
.bar{border-color:var(--blk);box-shadow:3px 3px 0 var(--blk)}
.bar>i{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 4px,transparent 4px 10px);background-size:28px 28px;animation:slide 1s steps(6) infinite}
@keyframes slide{to{background-position:28px 0}}
.bar>i::after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:#fff;opacity:.85}
.sprite{border:3px solid var(--blk);background:radial-gradient(circle at 50% 50%,rgba(255,46,136,.5) 1.6px,transparent 2.2px) 0 0/9px 9px,#17113a;box-shadow:6px 6px 0 var(--blk)}
.sprite svg{filter:drop-shadow(4px 0 0 var(--mag)) drop-shadow(-4px 0 0 var(--cy));animation:bob 1.1s steps(2) infinite,flick 3.4s steps(1) infinite}
@keyframes flick{0%,88%{filter:drop-shadow(4px 0 0 var(--mag)) drop-shadow(-4px 0 0 var(--cy))}90%{filter:drop-shadow(-6px 1px 0 var(--mag)) drop-shadow(6px -1px 0 var(--cy))}92%{filter:drop-shadow(6px 0 0 var(--cy)) drop-shadow(-6px 0 0 var(--mag))}94%,100%{filter:drop-shadow(4px 0 0 var(--mag)) drop-shadow(-4px 0 0 var(--cy))}}
.xpnum{text-shadow:2px 2px 0 var(--blk)}
.tipbox{background:var(--gold);color:var(--blk);border:3px solid var(--blk);border-left:3px solid var(--blk);box-shadow:5px 5px 0 var(--mag);font-weight:600;transform:rotate(-.6deg)}
.tipbox .btn{color:var(--ink)}
.tile{border:3px solid var(--blk);box-shadow:4px 4px 0 var(--blk);outline:3px solid transparent}
.tile.fora{outline-color:var(--red)}.tile.olho{outline-color:var(--gold)}.tile.safe{outline-color:var(--green)}
.tile:hover{transform:translateY(-3px) rotate(-1deg)}
.zone{box-shadow:5px 5px 0 var(--blk);background:rgba(5,3,15,.35)}
.pill{background:var(--blk);box-shadow:2px 2px 0 currentColor}
.chart>div{box-shadow:inset 0 0 0 1px var(--blk);transform-origin:bottom;animation:grow .6s steps(6) both}
@keyframes grow{from{transform:scaleY(0)}}
.rw.ready{box-shadow:6px 6px 0 var(--gold);animation:ready 1s steps(2) infinite}
@keyframes ready{50%{transform:translateY(-3px) rotate(.4deg)}}
.view{display:block}
#app.enter .view .card{animation:pop .5s steps(6) both}
#app.enter .view .card:nth-child(2){animation-delay:.06s}
#app.enter .view .card:nth-child(3){animation-delay:.12s}
#app.enter .view .card:nth-child(4){animation-delay:.18s}
#app.enter .view .grid>.card:nth-child(n+5){animation-delay:.24s}
@keyframes pop{0%{opacity:0;transform:translateY(26px) skewY(3deg) scale(.96);filter:hue-rotate(90deg)}60%{opacity:1;transform:translateY(-4px) skewY(-1deg);filter:none}100%{transform:none}}
#app.glitch{animation:glitch .36s steps(1)}
@keyframes glitch{0%{transform:translate(-6px,0);filter:hue-rotate(60deg) saturate(2)}20%{transform:translate(5px,-2px);filter:none}40%{transform:translate(-3px,2px);filter:hue-rotate(-60deg)}60%{transform:translate(2px,0);filter:none}100%{transform:none}}
.burst{position:fixed;left:50%;top:42%;z-index:40;pointer-events:none;background:var(--gold);color:var(--blk);font-family:var(--font-display);font-size:clamp(14px,4.5vw,22px);padding:46px 52px;text-align:center;line-height:1.4;filter:drop-shadow(6px 6px 0 var(--mag));clip-path:polygon(50% 0%,61% 18%,80% 8%,78% 28%,100% 32%,84% 48%,98% 66%,76% 68%,78% 92%,58% 80%,50% 100%,42% 80%,22% 92%,24% 68%,2% 66%,16% 48%,0% 32%,22% 28%,20% 8%,39% 18%);animation:boom .95s steps(10) forwards}
@keyframes boom{0%{transform:translate(-50%,-50%) rotate(-14deg) scale(.1);opacity:0}15%{transform:translate(-50%,-50%) rotate(-8deg) scale(1.25);opacity:1}30%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}85%{transform:translate(-50%,-50%) rotate(-8deg) scale(1.05);opacity:1}100%{transform:translate(-50%,-60%) rotate(-8deg) scale(1.3);opacity:0}}
.toast{border-color:var(--blk);box-shadow:5px 5px 0 var(--mag)}
@media (prefers-reduced-motion:reduce){h1,.sprite svg,.bar>i,.rw.ready,.chart>div,#app.enter .view .card,#app.glitch,.burst{animation:none!important}.burst{opacity:1}}


body{font-size:17px;line-height:1.45}
.btn,.tab,.pill,table.t th,.top .tag,h3,.toast,details>summary{font-family:var(--font-body);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.btn{font-size:13px;padding:9px 14px}.btn.sm{font-size:12px;padding:6px 10px}
.tab{font-size:14px;padding:10px 14px}
.pill{font-size:12px;padding:3px 7px}
table.t th{font-size:12px}
.top .tag{font-size:13px}
h3{font-size:13px;color:var(--cy)}
details>summary{font-size:14px;color:var(--gold)}
.toast{font-size:14px}
.small{font-size:15px}
.lbl{font-size:16px}
table.t{font-size:16px}
input,select{font-size:16px;font-family:var(--font-body)}
.dim{color:#bdb7e6}
.num{font-variant-numeric:tabular-nums}
.sprite{width:auto;height:auto;padding:16px 14px 10px;min-width:0}
.sprite svg{width:auto;height:auto;animation:none;filter:none}
.scene{display:flex;align-items:flex-end;justify-content:center;gap:2px}
.scene .sp svg{display:block;shape-rendering:crispEdges;filter:drop-shadow(3px 0 0 var(--mag)) drop-shadow(-3px 0 0 var(--cy));animation:bob 1.1s steps(2) infinite,flick 3.4s steps(1) infinite}
.scene .human svg{width:84px;height:auto}
.scene .rapt{transform:scaleX(-1)}
.scene .rapt svg{width:132px;height:auto;animation-delay:.5s,.9s}
.hero-grid{grid-template-columns:auto 1fr}
.clock{font-family:var(--font-display);font-size:clamp(26px,8vw,38px);line-height:1.2;text-shadow:3px 3px 0 var(--mag),-2px -2px 0 var(--cy)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:14px}
.cal b{font-size:12px;color:var(--dim);font-weight:700}
.cal i{font-style:normal;padding:6px 0;border:2px solid transparent;position:relative}
.cal i.today{background:var(--gold);color:var(--blk);font-weight:700;border-color:var(--blk);box-shadow:3px 3px 0 var(--mag)}
.cal i.ev::after{content:"";position:absolute;left:50%;bottom:1px;width:6px;height:6px;margin-left:-3px;background:var(--cy)}
.cal i.off{opacity:.3}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border:3px dashed var(--cy);padding:26px 14px;cursor:pointer;background:rgba(25,227,255,.07);font-weight:700}
.drop.over{background:rgba(255,46,136,.25);border-color:var(--mag)}
.drop input{display:none}
textarea{background:#120f26;border:3px solid var(--line);padding:8px 10px;color:inherit;font-family:var(--font-body);font-size:16px;width:100%;min-height:110px;max-width:100%}
.mbar{display:flex;align-items:flex-end;gap:3px;height:70px}
.mbar>div{flex:1;background:var(--cy);min-height:2px;position:relative}
.mbar>div span{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:10px;color:var(--dim)}
a.btn{text-decoration:none;display:inline-block}
.sw{width:34px;height:34px;padding:0}
.undo{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:25;max-width:calc(100vw - 32px)}
.ag td{padding:7px 6px}.ag td.tt{max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ag td.dy{white-space:nowrap;color:var(--cy);font-weight:700;text-transform:capitalize}.ag td.hr{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel-2);border:3px solid var(--line);padding:6px 10px;cursor:pointer;color:var(--ink);font-family:var(--font-body);font-size:14px;display:inline-flex;gap:6px;align-items:center;box-shadow:3px 3px 0 var(--blk)}
.chip:active{transform:translate(2px,2px);box-shadow:none}
.chip.done{background:rgba(98,210,111,.14);border-color:var(--green);color:var(--dim)}
.chip.done::before{content:"✓";color:var(--green);font-weight:800}
.qcheck{width:36px;height:36px;flex:0 0 auto;border:3px solid var(--line);background:#120f26;cursor:pointer;display:grid;place-items:center;box-shadow:3px 3px 0 var(--blk);color:transparent;font-weight:800}
.qcheck:hover{border-color:var(--gold)}.qcheck.on{background:var(--green);border-color:#c9ffd0;color:#06260c}
.qcheck::after{content:"✓"}
.pipe{display:grid;grid-template-columns:repeat(var(--n),1fr);position:relative;margin:8px 0 2px}
.pipe::before,.pipe::after{content:"";position:absolute;left:calc(50% / var(--n));top:13px;height:4px}
